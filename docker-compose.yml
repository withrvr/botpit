# Production shape. Dev extras (ports for postgres/redis, src bind mount,
# --reload) live in docker-compose.override.yml, which compose merges
# automatically. On a server: `docker compose --profile proxy up -d` with
# .env.staging / .env.production swapped in via env_file.
services:
  app:
    build: .
    env_file: .env.dev
    environment:
      DATABASE_URL: postgresql+asyncpg://botpit:botpit@postgres:5432/botpit
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS: redis
      # Ollama runs on the Windows host, not in compose.
      LLM_BASE_URL: http://host.docker.internal:11434
      HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: botpit
      POSTGRES_PASSWORD: botpit
      POSTGRES_DB: botpit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botpit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Not started in dev by default: dev talks to Ollama on the Windows host.
  # Exists to exercise the openai_compat adapter locally with
  #   LLM_PROVIDER=openai_compat LLM_BASE_URL=http://llm:8080/v1
  # and is the staging/production LLM tier (docs/local-model-setup.md §3.4).
  # Drop a GGUF into ./models and set LLM_GGUF if the filename differs.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    command: >
      -m /models/${LLM_GGUF:-qwen3-4b.Q4_K_M.gguf} --host 0.0.0.0 --port 8080
      --ctx-size 8192 --parallel 2 --cache-type-k q8_0 --cache-type-v q8_0
      --jinja
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOTPIT_DOMAIN: ${BOTPIT_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
