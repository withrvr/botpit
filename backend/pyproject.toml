[project]
name = "botpit-backend"
version = "0.1.0"
description = "FastAPI backend for botpit: room lifecycle, the deterministic game referee, the LLM agent client, and the live-play/game-history API."
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "pydantic>2.0",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic>=1.19.1,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.5,<4.0.0",
    "sqlmodel>=0.0.39,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.68.1,<3.0.0",
    "pyjwt<3.0.0,>=2.13.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    # botpit
    "redis[hiredis]>=8.1.0",
    "websockets>=13",
    "prometheus-client>=0.26.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.2.2",
    "coverage<8.0.0,>=7.4.3",
    # botpit
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "asgi-lifespan>=2.1",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling's default file-selection heuristic looks for a source directory
# matching the project name; renaming the package off its original "app" (to
# "botpit-backend", see docs/development/dependency-audit.md and the Phase
# 9.5 rebranding commit) broke that auto-detection since the actual source
# tree is still `app/`, not `botpit_backend/`. Spelled out explicitly here
# instead of renaming the directory, which the whole codebase imports as
# `app.*` throughout.
packages = ["app"]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
    # botpit additions
    "N",      # pep8-naming
    "ASYNC",  # flake8-async
    "S",      # bandit
    "RUF",    # ruff-specific
    "SIM",    # simplify
    "PT",     # pytest style
    "RET",    # return
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "S101",  # asserts are fine (tests, invariants)
    "S311",  # game RNG is not cryptographic
    "RUF012",
    "S105",  # template's "changethis" placeholders are validated at startup
    "S106",
    "S108",
    "RET504",  # template style: assign then return
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "ARG001", "ASYNC110", "T201"]
"app/alembic/**" = ["I001", "E501"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlmodel.SQLModel",
    "app.games.base.Frozen",
    "app.games.base.GameState",
    "app.games.base.Move",
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs live Redis (docker compose up redis)",
    "redis: unit test that needs live Redis for Lua scripts (skipped when unreachable)",
    "ollama: needs a reachable Ollama with the configured models",
]
addopts = "-q --strict-markers -m 'not ollama'"

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.fastapi]
entrypoint = "app.main:app"
