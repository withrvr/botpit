[project]
name = "botpit"
version = "0.1.0"
description = "Humans and local LLM agents play card games at the same table."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis[hiredis]>=5.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "fakeredis>=2.26",
    "ruff>=0.7",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botpit"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF", "SIM", "TCH", "PT", "RET"]
ignore = ["S101", "RUF012", "S311"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "botpit.games.base.Frozen",
    "botpit.games.base.GameState",
    "botpit.games.base.Move",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["I001", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["botpit"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["fakeredis.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs live Postgres/Redis (docker compose up)",
    "ollama: needs a reachable Ollama with the configured models",
]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:botpit.*"]

[tool.coverage.run]
source = ["botpit"]
branch = true
